# Credit Card Fraud Detection — Training Configuration
# Used by the ml-research training pipeline

model_name: "credit-card-fraud"
model_version: "1.0.0"

# Data
data_path: "data/creditcard.csv"
target_column: "Class"
drop_columns:
  - "Time"
feature_columns: null  # auto-detect: all columns except target

# Model
algorithm: "random_forest"
model_params:
  n_estimators: 100
  max_depth: 15
  min_samples_split: 5
  min_samples_leaf: 2
  class_weight: "balanced"
  random_state: 42
  n_jobs: -1

# Training
test_size: 0.2
random_state: 42

# Evaluation
primary_metric: "f1_score"
secondary_metrics:
  - "precision"
  - "recall"
  - "roc_auc"
  - "accuracy"
